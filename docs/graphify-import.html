<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucio AI Graphify Import</title><style>body{font:16px system-ui;background:#101827;color:#f7f8fa;max-width:760px;margin:60px auto;padding:20px}section{background:#1b2940;border-radius:12px;padding:24px;margin:20px 0}button,input{font:inherit;padding:12px;margin:6px}button{cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Lucio AI — Graphify Import</h1><p>Sign in with your authorized Google account, then select your original graph.json. Your file is sent only to your Supabase project.</p><section><h2>1. Google sign-in</h2><button id="login">Sign in with Google</button><button id="logout" hidden>Sign out</button><p id="user">Checking session…</p></section><section><h2>2. Upload graph</h2><input id="file" type="file" accept=".json,application/json"><button id="upload" disabled>Import Graph</button><pre id="status" role="status" aria-live="polite"></pre></section><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const base='https://eyukkmfbdvvvfnjajydf.supabase.co',key='sb_publishable_YHh1SsGHXmzd4g9iMbsCYw_J7tchzev',client=createClient(base,key),api=base+'/functions/v1/graphify-api',el=id=>document.getElementById(id);let session;
async function update(){const{data}=await client.auth.getSession();session=data.session;el('user').textContent=session?'Signed in: '+session.user.email:'Not signed in';el('login').hidden=!!session;el('logout').hidden=!session;el('upload').disabled=!session||!el('file').files.length}
el('login').onclick=async()=>{const{error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)el('status').textContent=error.message};
el('logout').onclick=async()=>{await client.auth.signOut();update()};el('file').onchange=update;client.auth.onAuthStateChange(()=>update());await update();
el('upload').onclick=async()=>{el('upload').disabled=true;try{const f=el('file').files[0],g=JSON.parse(await f.text());if(!Array.isArray(g.nodes)||!Array.isArray(g.links))throw Error('Expected nodes and links arrays');const{data}=await client.auth.getSession();if(!data.session)throw Error('Sign in again');let done=0,total=g.nodes.length+g.links.length;for(const[kind,records]of[['node',g.nodes],['link',g.links]])for(let i=0;i<records.length;i+=100){const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+data.session.access_token,'apikey':key},body:JSON.stringify({action:'import',kind,records:records.slice(i,i+100),offset:i})});if(!r.ok)throw Error(kind+' batch '+i+' failed: '+(await r.text()).slice(0,200));done+=Math.min(100,records.length-i);el('status').textContent='Imported '+done+' of '+total+' records';}el('status').textContent='Import completed: '+done+' records.'}catch(e){el('status').textContent='Stopped: '+e.message+' You can retry safely.'}finally{update()}};
</script></body></html>
